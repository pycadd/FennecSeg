[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fennecseg"
version = "0.2.0"
description = "Compact, fast 3D CT segmentation models and a library to run them"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "PYCAD" }]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy",
  "scipy",
  "nibabel",
  "SimpleITK",
  "safetensors",
  "dynamic_network_architectures==0.4.4",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.23"]

[project.urls]
Homepage = "https://github.com/pycadd/FennecSeg"
Models = "https://huggingface.co/amine0110/fennecseg"

[project.scripts]
fennecseg = "fennecseg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
